      - parameter: idlab-fn:str
        value: $(actor_gender_obj)
      - parameter: idlab-fn:otherStr
        value: null
    po:
    - - a
      - obj:AttributeAssignment
    - p: obj:assignsAttributeTo
      o: $(actor)
      type: iri
    - p: obj:assignsPropertyOfType
      o: obj:gender
