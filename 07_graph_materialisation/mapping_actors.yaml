prefixes:
  obj: https://w3id.org/dharc/ontology/chad-ap/object/development/14/schema/
  owl: http://www.w3.org/2002/07/owl#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  idlab-fn: http://example.com/idlab/function/
  edtf: http://id.loc.gov/datatypes/edtf/
mappings:
  actor_person:
    sources:
    - bnf_actors_ready.csv~csv
    s: $(actor)
    type: iri
    condition:
      function: idlab-fn:equal
      parameters:
      - parameter: idlab-fn:str
        value: $(entity_type)
      - parameter: idlab-fn:otherStr
        value: https://w3id.org/dharc/ontology/chad-ap/object/development/14/schema/Person
    po:
    - - a
      - obj:Person
  actor_group:
    sources:
    - bnf_actors_ready.csv~csv
    s: $(actor)
    type: iri
    condition:
      function: idlab-fn:equal
      parameters:
      - parameter: idlab-fn:str
        value: $(entity_type)
      - parameter: idlab-fn:otherStr
        value: https://w3id.org/dharc/ontology/chad-ap/object/development/14/schema/Organization
    po:
    - - a
      - obj:Organization
  actor_name_appellation:
    sources:
    - bnf_actors_ready.csv~csv
    s: $(actor_app_fullname)
    type: iri
    condition:
      function: idlab-fn:notEqual
      parameters:
      - parameter: idlab-fn:str
        value: $(actor_name)
      - parameter: idlab-fn:otherStr
        value: null
    po:
    - - a
      - obj:Appellation
    - - obj:hasType
      - obj:full-name~iri
    - - obj:hasSymbolicContent
      - $(actor_name)
      - xsd:string
  actor_name_link:
    sources:
    - bnf_actors_ready.csv~csv
    s: $(actor)
    type: iri
    condition:
      function: idlab-fn:notEqual
      parameters:
      - parameter: idlab-fn:str
        value: $(actor_name)
      - parameter: idlab-fn:otherStr
        value: null
    po:
    - p: obj:isIdentifiedBy
      o: $(actor_app_fullname)
      type: iri
  actor_firstname_appellation:
