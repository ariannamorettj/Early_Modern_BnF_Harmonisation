[PYTHON]
python_bin = /Users/ariannamorettj/miniforge3/bin/python3.12

[ENRICHED_INPUTS]
; Module 06 outputs (primary – preferred when present).
; Paths are relative to this 07_graph_materialisation/ folder.
actors_enriched_csv   = ../06_mapping/output/bnf_actors_enriched.csv
editions_enriched_csv = ../06_mapping/output/bnf_editions_enriched.csv
; Module 05 fallback (used when module 06 outputs are absent).
actors_optimised_csv  = ../05_subset_optimisation/output/bnf_actors_optimised.csv
actors_minimal_csv    = ../05_subset_optimisation/output/bnf_actors_optimised_minimal.csv

[RAW_INPUTS]
; Legacy ZIP inputs – used only when no upstream CSVs are available.
; Paths are resolved relative to this 07_graph_materialisation folder.
actors_zip = ../01_data_retrieval/02_actors/data/old_zip/actor_data.zip
editions_zip = ../01_data_retrieval/01_editions/data/old_zip/bnf_edition_data_raw.zip

[DIRECTORIES]
; All generated artefacts stay inside 07_graph_materialisation.
ready_full_dir = input/ready_to_convert
ready_sample_dir = input/sample_ready_to_convert
output_full_dir = output/full
output_sample_dir = output/sample
runtime_config_dir = output/runtime_configs
logs_dir = logs

[MORPH_KGC]
output_format = N-TRIPLES
output_serialization = ntriples
mapping_partitioning = NO
infer_sql_datatypes = no
only_printable_characters = no
logging_level = INFO
project_iri_base = https://w3id.org/bnf/ontology/chad-ap/data/
udfs = udfs.py
