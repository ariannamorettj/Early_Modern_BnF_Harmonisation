mappings:
  edition_manifestation:
    sources:
    - bnf_editions_ready.csv~csv
    s: $(edition)
    type: iri
    po:
    - - a
      - lrmoo:F3_Manifestation
  edition_record_type:
    sources:
    - bnf_editions_ready.csv~csv
    s: $(edition)
    type: iri
    condition:
      function: idlab-fn:notEqual
      parameters:
      - parameter: idlab-fn:str
        value: $(record_type)
      - parameter: idlab-fn:otherStr
        value: null
    po:
    - p: obj:hasType
      o: $(record_type)
      type: iri
  edition_bnf_identifier:
