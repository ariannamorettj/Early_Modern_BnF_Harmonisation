        value: $(bnf_id)
      - parameter: idlab-fn:otherStr
        value: null
    po:
    - - a
      - obj:Identifier
    - - obj:hasType
      - aat:300404621~iri
    - - obj:hasSymbolicContent
      - $(bnf_id)
      - xsd:string
